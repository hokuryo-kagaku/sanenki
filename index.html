<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#fff4e0">
<title>酸・塩基クイズ</title>
<style>
  :root{
    --bg:#fff7ea; --card:#ffffff; --text:#2d2a32; --sub:#7a7280; --line:#f0e4d0;
    --acid:#ff6b6b; --acidD:#d94848; --base:#4d96ff; --baseD:#2f72d6;
    --ok:#22b07d; --okBg:#e3f7ee; --ng:#ff5a5f; --ngBg:#ffe8e8;
    --accent:#ffb627; --accentD:#e0951a;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; height:100%;}
  body{
    background:
      radial-gradient(circle at 10% 0%, #ffe1d6 0, transparent 40%),
      radial-gradient(circle at 100% 30%, #dceaff 0, transparent 40%),
      var(--bg);
    background-attachment:fixed;
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
    touch-action:manipulation; user-select:none; -webkit-user-select:none; overscroll-behavior:none;
  }
  .app{max-width:440px; margin:0 auto; min-height:100%; display:flex; flex-direction:column;
       padding:calc(env(safe-area-inset-top) + 10px) 16px calc(env(safe-area-inset-bottom) + 16px);}
  .screen{display:none; flex:1; flex-direction:column;}
  .screen.on{display:flex;}
  .num{font-variant-numeric:tabular-nums;}
  .f{font-family:"Helvetica Neue",Arial,sans-serif; font-weight:700; letter-spacing:.02em;}
  sub{font-size:.68em; line-height:0;}

  /* ===== タイトル ===== */
  .menu-link{align-self:flex-start; color:var(--sub); font-size:14px; text-decoration:none; padding:6px 2px;}
  .title-wrap{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px; text-align:center;}
  .logo{display:flex; gap:14px;}
  .bubble{width:84px; height:84px; border-radius:50%; display:flex; align-items:center; justify-content:center;
          color:#fff; font-size:26px; font-family:"Helvetica Neue",Arial,sans-serif; font-weight:800;
          animation:float 3s ease-in-out infinite;}
  .bubble.a{background:radial-gradient(circle at 30% 30%, #ff9a9a, var(--acid)); box-shadow:0 6px 0 var(--acidD);}
  .bubble.b{background:radial-gradient(circle at 30% 30%, #8fbcff, var(--base)); box-shadow:0 6px 0 var(--baseD); animation-delay:-1.5s;}
  .bubble sup{font-size:.6em;}
  @keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}
  h1{margin:0; font-size:34px; font-weight:800; letter-spacing:.06em;}
  h1 .a{color:var(--acid);} h1 .b{color:var(--base);}
  .catch{margin:-12px 0 0; color:var(--sub); font-size:15px;}
  .info{background:var(--card); border-radius:18px; padding:14px 18px; font-size:15px; line-height:1.8;
        box-shadow:0 2px 8px rgba(120,90,40,.08);}
  .info b{color:var(--accentD);}
  .best-lbl{color:var(--sub); font-size:13px; letter-spacing:.2em;}
  .best-val{font-size:26px; font-weight:800; margin-top:2px;}
  .start{border:none; border-radius:40px; padding:18px 64px; cursor:pointer;
         background:linear-gradient(180deg,#ffcb52,var(--accent)); box-shadow:0 6px 0 var(--accentD);
         color:#fff; font-size:24px; font-weight:800; letter-spacing:.1em; text-shadow:0 1px 0 rgba(0,0,0,.15);}
  .start:active{transform:translateY(5px); box-shadow:0 1px 0 var(--accentD);}

  .chal{display:flex; flex-direction:column; align-items:center; gap:6px; margin-top:-6px;}
  .chalBtn{border:none; border-radius:30px; padding:13px 30px; cursor:pointer; color:#fff; font-size:18px; font-weight:800;
           background:linear-gradient(135deg,#ff5f6d,#b14cff); box-shadow:0 5px 0 #7d2bb8; letter-spacing:.04em;}
  .chalBtn:active{transform:translateY(4px); box-shadow:0 1px 0 #7d2bb8;}
  .chal .best-lbl{letter-spacing:.1em;}
  .unlock{width:100%; border-radius:20px; padding:16px; color:#fff; text-align:center; animation:pop .6s 1.4s both;
          background:linear-gradient(135deg,#ff5f6d,#b14cff); box-shadow:0 6px 18px rgba(177,76,255,.35);}
  .unlock .u1{font-size:20px; font-weight:800;}
  .unlock .u2{font-size:14px; opacity:.95; margin:4px 0 12px; line-height:1.6;}
  .unlock button{border:none; border-radius:14px; padding:12px 26px; background:#fff; color:#8a2fd0; font-size:17px; font-weight:800; cursor:pointer;}
  .mode-lbl{display:inline-block; font-size:13px; font-weight:800; color:#fff; border-radius:12px; padding:2px 12px; margin-right:6px;
            background:linear-gradient(135deg,#ff5f6d,#b14cff);}
  .prog.many{gap:2px;} .prog.many i{height:7px; border-radius:2px;}
  .sumBtn{border:none; border-radius:30px; padding:12px 28px; cursor:pointer; background:#fff; color:var(--text);
          font-size:16px; font-weight:700; box-shadow:0 3px 0 var(--line), 0 2px 8px rgba(120,90,40,.1); margin-top:-8px;}
  .sumBtn:active{transform:translateY(2px); box-shadow:0 1px 0 var(--line);}

  /* ===== まとめ ===== */
  .sum-head{display:flex; align-items:center; gap:10px; height:44px;}
  .sum-head h2{margin:0; font-size:20px; font-weight:800;}
  .sec{margin-top:14px;}
  .sec-ttl{display:inline-block; color:#fff; font-weight:800; font-size:16px; border-radius:14px; padding:4px 16px; margin-bottom:10px;}
  .sec-ttl.acid{background:var(--acid);} .sec-ttl.base{background:var(--base);}
  .item{display:flex; align-items:center; gap:10px; background:var(--card); border-radius:16px; padding:12px 14px; margin-bottom:8px;
        box-shadow:0 2px 8px rgba(120,90,40,.08);}
  .item .nm{font-size:15px; font-weight:700; color:var(--sub);}
  .item .fm{font-size:24px; margin-top:2px;}
  .badges{margin-left:auto; display:flex; gap:6px; flex-shrink:0;}
  .bd{border-radius:10px; padding:5px 9px; font-weight:800; font-size:15px; white-space:nowrap;}
  .bd.v{background:#f3ede3; color:var(--text);}
  .bd.sa{background:var(--acid); color:#fff;}  .bd.wa{background:#ffe3e3; color:var(--acidD);}
  .bd.sb{background:var(--base); color:#fff;}  .bd.wb{background:#e2edff; color:var(--baseD);}
  .sum-note{font-size:13px; color:var(--sub); line-height:1.7; margin:10px 2px 16px;}

  /* ===== クイズ ===== */
  .topbar{display:flex; align-items:center; justify-content:space-between; height:40px;}
  .quit{border:none; background:var(--card); color:var(--sub); border-radius:20px; padding:8px 14px;
        font-size:14px; font-weight:700; cursor:pointer; box-shadow:0 1px 4px rgba(0,0,0,.08);}
  .timer{font-size:15px; color:var(--sub);}
  .timer b{color:var(--text); font-size:18px;}
  .prog{display:flex; gap:5px; margin:12px 0 14px;}
  .prog i{flex:1; height:8px; border-radius:4px; background:var(--line);}
  .prog i.ok{background:var(--ok);} .prog i.ng{background:var(--ng);} .prog i.now{background:var(--accent);}
  .qcard{background:var(--card); border-radius:22px; padding:18px 18px 22px; text-align:center;
         box-shadow:0 3px 12px rgba(120,90,40,.1); position:relative;}
  .qno{display:inline-block; background:var(--accent); color:#fff; font-weight:800; border-radius:14px; padding:3px 14px; font-size:14px;}
  .qtext{font-size:22px; line-height:1.6; margin-top:12px; font-weight:700;}
  .qtext b{font-size:26px;}
  .qtext .f{font-size:32px;}
  .opts{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:16px;}
  .opt{border:none; border-radius:18px; background:var(--card); color:var(--text); min-height:78px; padding:10px 8px;
       font-size:19px; font-weight:700; cursor:pointer; box-shadow:0 4px 0 var(--line), 0 2px 8px rgba(120,90,40,.08);
       font-family:inherit; line-height:1.3;}
  .opt .f{font-size:22px;}
  .opt.long{font-size:16px;}
  .opt:active{transform:translateY(3px); box-shadow:0 1px 0 var(--line);}
  .opt.ok{background:var(--okBg); color:var(--ok); box-shadow:0 4px 0 var(--ok); outline:3px solid var(--ok);}
  .opt.ng{background:var(--ngBg); color:var(--ng); box-shadow:0 4px 0 var(--ng); animation:shake .35s;}
  .opt.dim{opacity:.45;}
  .opts.lock .opt{pointer-events:none;}
  @keyframes shake{0%,100%{translate:0;}25%{translate:-6px;}50%{translate:6px;}75%{translate:-4px;}}

  .mark{position:fixed; left:50%; top:34%; transform:translate(-50%,-50%); font-size:150px; font-weight:900;
        pointer-events:none; opacity:0; z-index:5; line-height:1;}
  .mark.show{animation:mark .7s ease-out forwards;}
  .mark.ok{color:var(--ok);} .mark.ng{color:var(--ng);}
  @keyframes mark{0%{opacity:0; transform:translate(-50%,-50%) scale(.4);}30%{opacity:.9; transform:translate(-50%,-50%) scale(1.05);}100%{opacity:0; transform:translate(-50%,-50%) scale(1);}}

  .feedback{display:none; margin-top:16px; border-radius:18px; padding:14px 16px; font-size:16px; line-height:1.7;}
  .feedback.on{display:block;}
  .feedback.ok{background:var(--okBg);} .feedback.ng{background:var(--ngBg);}
  .feedback .hd{font-weight:800; font-size:18px;}
  .feedback b, .rv b, .f{white-space:nowrap;}
  .feedback.ok .hd{color:var(--ok);} .feedback.ng .hd{color:var(--ng);}
  .nextBtn{display:block; width:100%; margin-top:12px; border:none; border-radius:16px; padding:15px 0; cursor:pointer;
           background:var(--accent); box-shadow:0 5px 0 var(--accentD); color:#fff; font-size:19px; font-weight:800;}
  .nextBtn:active{transform:translateY(4px); box-shadow:0 1px 0 var(--accentD);}

  /* やめる確認 */
  .modal{position:fixed; inset:0; display:none; align-items:center; justify-content:center; z-index:20;
         background:rgba(60,40,20,.35); padding:16px;}
  .modal.on{display:flex;}
  .dialog{background:#fff; border-radius:22px; padding:24px 20px 20px; width:100%; max-width:320px; text-align:center;
          box-shadow:0 10px 30px rgba(0,0,0,.2);}
  .dialog p{margin:0 0 6px; font-size:18px; font-weight:800;}
  .dialog .note{font-size:13px; color:var(--sub); margin-bottom:18px;}
  .dialog .row{display:flex; gap:10px;}
  .dialog button{flex:1; border:none; border-radius:14px; padding:13px 0; font-size:16px; font-weight:700; cursor:pointer;}
  .yes{background:var(--ng); color:#fff;} .no{background:#f1ece4; color:var(--text);}

  /* ===== 結果（得点で演出が変わる：perfect / great / ok / low） ===== */
  .stage{position:relative; width:100%; padding:22px 0 18px; border-radius:26px; overflow:hidden; isolation:isolate;}
  .stage > *:not(.rays){position:relative; z-index:1;}
  .rays{position:absolute; left:50%; top:50%; width:760px; height:760px; margin:-380px 0 0 -380px; z-index:0; display:none;
        background:repeating-conic-gradient(rgba(255,190,40,.28) 0 9deg, transparent 9deg 18deg);
        animation:spin 14s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .crown{display:none; font-size:64px; line-height:1; animation:crown 1s cubic-bezier(.2,1.6,.4,1) both;}
  @keyframes crown{0%{transform:translateY(-60px) scale(.3) rotate(-30deg); opacity:0;}100%{transform:none; opacity:1;}}
  .res-badge{display:none; margin:6px auto 0; width:max-content; border-radius:20px; padding:4px 16px; font-weight:800; font-size:15px;}
  .stars{margin:8px 0 4px; height:52px;}
  .stars span{display:inline-block; font-size:46px; line-height:1; margin:0 3px; color:#e9dfcd; transform:scale(0);
              animation:starPop .45s cubic-bezier(.2,1.8,.4,1) forwards;}
  .stars span:nth-child(1){animation-delay:.25s;} .stars span:nth-child(2){animation-delay:.5s;} .stars span:nth-child(3){animation-delay:.75s;}
  .stars span.on{color:#ffb627; text-shadow:0 0 14px rgba(255,182,39,.7), 0 3px 0 #e0951a;}
  @keyframes starPop{0%{transform:scale(0) rotate(-90deg);}100%{transform:scale(1) rotate(0);}}

  .tier-perfect{background:radial-gradient(circle at 50% 40%, #fff6c8, #ffe28a 55%, #ffc94d);
                box-shadow:0 0 0 4px #ffd35c, 0 10px 30px rgba(230,160,20,.35);}
  .tier-perfect .rays{display:block;}
  .tier-perfect .crown{display:block;}
  .tier-perfect .res-msg{font-size:40px; background:linear-gradient(90deg,#c97a00,#ff9d00,#ffdd55,#ff9d00,#c97a00); background-size:200% auto;
                         -webkit-background-clip:text; background-clip:text; color:transparent; animation:shine 2s linear infinite, pop .6s;}
  @keyframes shine{to{background-position:200% center;}}
  .tier-perfect .res-badge{display:block; background:#c97a00; color:#fff; animation:pop .6s .9s both;}
  .tier-perfect .score b{color:#c97a00;}
  .tier-great{background:radial-gradient(circle at 50% 40%, #fffaf0, #ffe9c2); box-shadow:0 0 0 3px #ffe0a3;}
  .tier-great .rays{display:block; opacity:.5;}
  .tier-great .res-msg{font-size:34px; animation:pop .6s;}
  .tier-great .res-badge{display:block; background:#fff; color:var(--accentD); animation:pop .6s .9s both;}

  .confetti{position:fixed; inset:0; pointer-events:none; z-index:30; overflow:hidden;}
  .confetti i{position:absolute; top:-20px; width:9px; height:14px; border-radius:2px; animation:fall linear forwards;}
  @keyframes fall{to{transform:translate(var(--dx), 110vh) rotate(var(--r));}}
  @media (prefers-reduced-motion: reduce){ .rays, .confetti{display:none !important;} }

  /* ===== 結果 ===== */
  .res-wrap{flex:1; display:flex; flex-direction:column; align-items:center; gap:14px; text-align:center; padding-top:12px;}
  .res-msg{font-size:26px; font-weight:800; color:var(--accentD);}
  .score{font-size:20px; font-weight:700;}
  .score b{font-size:64px; color:var(--text); line-height:1;}
  .res-sub{color:var(--sub); font-size:15px;}
  .newbest{color:var(--acid); font-size:20px; font-weight:800; animation:pop .6s;}
  @keyframes pop{0%{transform:scale(.4);opacity:0;}70%{transform:scale(1.15);}100%{transform:scale(1);opacity:1;}}
  .review{width:100%; text-align:left;}
  .review h2{font-size:16px; margin:6px 0 8px; color:var(--sub);}
  .rv{background:var(--card); border-radius:16px; padding:12px 14px; margin-bottom:10px; font-size:15px; line-height:1.7;
      box-shadow:0 2px 8px rgba(120,90,40,.08); border-left:6px solid var(--ng);}
  .rv .q{font-weight:700;}
  .rv .you{color:var(--ng);} .rv .ans{color:var(--ok); font-weight:700;}
  .rv .ex{color:var(--sub); font-size:14px;}
  .perfect{background:var(--okBg); color:var(--ok); border-radius:16px; padding:14px; font-weight:700; width:100%;}
  .btns{display:flex; gap:10px; width:100%; margin-top:4px;}
  .btn{flex:1; border:none; border-radius:16px; padding:15px 0; font-size:18px; font-weight:800; cursor:pointer;}
  .btn.main{background:var(--accent); color:#fff; box-shadow:0 5px 0 var(--accentD);}
  .btn.main:active{transform:translateY(4px); box-shadow:0 1px 0 var(--accentD);}
  .btn.sub{background:#fff; color:var(--text); box-shadow:0 2px 8px rgba(120,90,40,.12);}
</style>
</head>
<body>
<div class="app">

  <!-- タイトル -->
  <section class="screen on" id="start">
    <a class="menu-link" href="../">← メニューへ</a>
    <div class="title-wrap">
      <div class="logo" aria-hidden="true">
        <div class="bubble a">H<sup>+</sup></div>
        <div class="bubble b">OH<sup>−</sup></div>
      </div>
      <h1><span class="a">酸</span>・<span class="b">塩基</span>クイズ</h1>
      <p class="catch">価数・強弱・化学式をチェック！</p>
      <div class="info">4択問題が <b>10問</b> 出ます。<br>まちがえたら解説を読んで覚えよう！</div>
      <div id="bestBox" hidden>
        <div class="best-lbl">BEST</div>
        <div class="best-val num" id="bestStart"></div>
      </div>
      <button class="start" id="startBtn">スタート</button>
      <div class="chal" id="chalBox" hidden>
        <button class="chalBtn" id="chalBtn">🔥 全問チャレンジ</button>
        <div class="best-lbl" id="chalBest"></div>
      </div>
      <button class="sumBtn" id="sumBtn">📋 酸・塩基のまとめを見る</button>
    </div>
  </section>

  <!-- まとめ -->
  <section class="screen" id="summary">
    <div class="sum-head">
      <button class="quit" id="sumBack">← もどる</button>
      <h2>酸・塩基のまとめ</h2>
    </div>
    <div id="sumBody"></div>
    <button class="nextBtn" id="sumStart">クイズに挑戦する</button>
  </section>

  <!-- クイズ -->
  <section class="screen" id="quiz">
    <div class="topbar">
      <button class="quit" id="quitBtn">✕ やめる</button>
      <div class="timer">正解 <b class="num" id="okCount">0</b></div>
    </div>
    <div class="prog" id="prog"></div>
    <div class="qcard">
      <span class="mode-lbl" id="qMode" hidden>全問チャレンジ</span><span class="qno" id="qno">第1問</span>
      <div class="qtext" id="qtext"></div>
    </div>
    <div class="opts" id="opts"></div>
    <div class="feedback" id="fb">
      <div class="hd" id="fbHd"></div>
      <div id="fbEx"></div>
      <button class="nextBtn" id="nextBtn">次へ</button>
    </div>
  </section>

  <!-- 結果 -->
  <section class="screen" id="result">
    <div class="res-wrap">
      <div class="stage" id="stage">
        <div class="rays"></div>
        <div class="crown">👑</div>
        <div class="res-msg" id="rMsg"></div>
        <div class="res-badge" id="rBadge"></div>
        <div class="stars" id="stars"><span>★</span><span>★</span><span>★</span></div>
        <div class="score"><span id="rTotal">10</span>問中 <b class="num" id="rScore"></b> 問 正解</div>
      </div>
      <div class="newbest" id="rNew" hidden>★ 自己ベスト更新！ ★</div>
      <div class="unlock" id="rUnlock" hidden>
        <div class="u1" id="rUnlockTtl">🔓 全問チャレンジ 解放！</div>
        <div class="u2" id="rUnlockTxt"></div>
        <button id="rUnlockBtn">🔥 挑戦する</button>
      </div>
      <div class="res-sub" id="rBest"></div>
      <div class="review" id="review"></div>
      <div class="btns">
        <button class="btn sub" id="topBtn">タイトルへ</button>
        <button class="btn main" id="retryBtn">もう一度</button>
      </div>
    </div>
  </section>
</div>

<div class="mark" id="mark"></div>
<div class="modal" id="modal">
  <div class="dialog">
    <p>クイズをやめますか？</p>
    <div class="note">タイトルに戻ります。記録は残りません。</div>
    <div class="row">
      <button class="no" id="noBtn">つづける</button>
      <button class="yes" id="yesBtn">やめる</button>
    </div>
  </div>
</div>

<script>
// ===== 物質データ（fake はまちがえやすいニセの化学式） =====
const S = [
  {n:"塩酸",           f:"HCl",                     v:1, t:"酸",   s:"強", fake:["HCl<sub>2</sub>","H<sub>2</sub>Cl","ClH<sub>2</sub>"]},
  {n:"硝酸",           f:"HNO<sub>3</sub>",          v:1, t:"酸",   s:"強", fake:["HNO<sub>2</sub>","H<sub>2</sub>NO<sub>3</sub>","HNO<sub>4</sub>"]},
  {n:"硫酸",           f:"H<sub>2</sub>SO<sub>4</sub>", v:2, t:"酸", s:"強", fake:["H<sub>2</sub>SO<sub>3</sub>","HSO<sub>4</sub>","H<sub>3</sub>SO<sub>4</sub>"]},
  {n:"酢酸",           f:"CH<sub>3</sub>COOH",       v:1, t:"酸",   s:"弱", fake:["CH<sub>3</sub>COH","CH<sub>4</sub>COOH","CH<sub>3</sub>OOH"]},
  {n:"水酸化ナトリウム", f:"NaOH",                    v:1, t:"塩基", s:"強", fake:["NaOH<sub>2</sub>","Na(OH)<sub>2</sub>","Na<sub>2</sub>OH"]},
  {n:"水酸化カルシウム", f:"Ca(OH)<sub>2</sub>",       v:2, t:"塩基", s:"強", fake:["CaOH","CaOH<sub>2</sub>","Ca<sub>2</sub>OH"]},
  {n:"アンモニア",      f:"NH<sub>3</sub>",           v:1, t:"塩基", s:"弱", fake:["NH<sub>4</sub>","NH<sub>2</sub>","N<sub>3</sub>H"]}
];
const N_Q = 10;
// 自己ベストの保存名（normal＝10問、all＝全問チャレンジ）と、全問チャレンジ解放の印
const KEYS = {normal:"sanenki-best", all:"sanenki-best-all"};
const UNLOCK_KEY = "sanenki-unlocked";
const KINDS = ["強酸","弱酸","強塩基","弱塩基"];
const VALS = ["1価","2価","3価","4価"];

const $ = id => document.getElementById(id);
const kind = s => s.s + s.t;
const F = f => '<span class="f">' + f + '</span>';
const line = s => s.n + "　" + F(s.f) + "　は <b>" + s.v + "価の" + kind(s) + "</b>";
const shuffle = a => { for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = (a, k) => shuffle(a.slice()).slice(0, k);
const N_ALL = makePool().length; // 全問チャレンジの問題数

// ===== 問題を作る =====
function makePool(){
  const pool = [];
  S.forEach(s => {
    // 価数
    pool.push({sub:s, q:"<b>" + s.n + "</b> の価数は？", opts:VALS, ans:s.v - 1, ex:line(s)});
    // 強弱（酸・塩基も含めて）
    pool.push({sub:s, q:"<b>" + s.n + "</b> は次のうちどれ？", opts:KINDS, ans:KINDS.indexOf(kind(s)), ex:line(s)});
    // 物質名 → 化学式（ニセの化学式2つ＋ほかの物質1つ）
    const others = S.filter(o => o !== s).map(o => o.f);
    const fo = shuffle([s.f, ...pick(s.fake, 2), ...pick(others, 1)]);
    pool.push({sub:s, q:"<b>" + s.n + "</b> の化学式は？", opts:fo.map(F), ans:fo.indexOf(s.f), ex:line(s)});
    // 化学式 → 物質名
    const no = shuffle([s.n, ...pick(S.filter(o => o !== s).map(o => o.n), 3)]);
    pool.push({sub:s, q:F(s.f) + " の物質名は？", opts:no, ans:no.indexOf(s.n), ex:line(s)});
    // 条件 → 物質（同じ条件の物質は選択肢に入れない）
    const same = S.filter(o => o.v === s.v && kind(o) === kind(s));
    const co = shuffle([s.n, ...pick(S.filter(o => !same.includes(o)).map(o => o.n), 3)]);
    pool.push({sub:s, q:"<b>" + s.v + "価の" + kind(s) + "</b> はどれ？", opts:co, ans:co.indexOf(s.n),
      ex: same.length > 1 ? s.v + "価の" + kind(s) + "は " + same.map(o => o.n + "（" + F(o.f) + "）").join(" と ") : line(s)});
  });
  // 同じ問題文の重複（1価の強酸など）を除く
  const seen = new Set();
  return pool.filter(p => seen.has(p.q) ? false : seen.add(p.q));
}

// 7種類の物質から1問ずつ選び、残りをランダムに足して順番を混ぜる（全物質が必ず出る）
function pickQuestions(){
  const pool = makePool();
  const first = S.map(s => pick(pool.filter(p => p.sub === s), 1)[0]);
  const rest = pick(pool.filter(p => !first.includes(p)), N_Q - first.length);
  return shuffle([...first, ...rest]);
}

// ===== 進行 =====
let mode = "normal", qs, idx, score, wrongs, results;
let unlockedNow = false; // 保存できない端末でも、その場では解放されるように

function getBest(m){ try{ return JSON.parse(localStorage.getItem(KEYS[m])); }catch(e){ return null; } }
function setBest(m, b){ try{ localStorage.setItem(KEYS[m], JSON.stringify(b)); }catch(e){} }
function bestText(b, total){ return b ? total + "問中 " + b.score + "問正解" : "まだ記録なし"; }
function isUnlocked(){ if(unlockedNow) return true; try{ return localStorage.getItem(UNLOCK_KEY) === "1"; }catch(e){ return false; } }
function unlock(){ unlockedNow = true; try{ localStorage.setItem(UNLOCK_KEY, "1"); }catch(e){} }
function show(id){ document.querySelectorAll(".screen").forEach(s => s.classList.toggle("on", s.id === id)); window.scrollTo(0, 0); }

function startQuiz(m){
  mode = m === "all" ? "all" : "normal";
  qs = mode === "all" ? shuffle(makePool()) : pickQuestions();
  $("qMode").hidden = mode !== "all";
  $("prog").className = "prog" + (qs.length > 15 ? " many" : "");
  idx = 0; score = 0; wrongs = []; results = [];
  $("okCount").textContent = "0";
  clearConfetti();
  show("quiz");
  render();
}

function render(){
  const q = qs[idx];
  $("qno").textContent = "第" + (idx + 1) + "問" + (mode === "all" ? " / " + qs.length : "");
  $("qtext").innerHTML = q.q;
  $("prog").innerHTML = qs.map((_, i) => '<i class="' + (i < idx ? results[i] : i === idx ? "now" : "") + '"></i>').join("");
  const box = $("opts");
  box.className = "opts";
  box.innerHTML = "";
  q.opts.forEach((o, i) => {
    const b = document.createElement("button");
    b.className = "opt" + (o.replace(/<[^>]+>/g, "").length > 6 ? " long" : "");
    b.innerHTML = o;
    b.addEventListener("click", () => answer(i));
    box.appendChild(b);
  });
  $("fb").className = "feedback";
}

function answer(i){
  const q = qs[idx];
  const ok = i === q.ans;
  const btns = [...$("opts").children];
  $("opts").classList.add("lock");
  btns.forEach((b, k) => {
    if(k === q.ans) b.classList.add("ok");
    else if(k === i) b.classList.add("ng");
    else b.classList.add("dim");
  });
  const m = $("mark");
  m.textContent = ok ? "◯" : "✕";
  m.className = "mark " + (ok ? "ok" : "ng");
  void m.offsetWidth; m.classList.add("show");
  if(ok){ score++; $("okCount").textContent = score; }
  else{
    wrongs.push({q:q.q, you:q.opts[i], ans:q.opts[q.ans], ex:q.ex});
    if(navigator.vibrate) navigator.vibrate(80);
  }
  results[idx] = ok ? "ok" : "ng";
  $("prog").children[idx].className = results[idx];
  $("fbHd").innerHTML = ok ? "正解！" : "ざんねん… 正解は「" + q.opts[q.ans] + "」";
  $("fbEx").innerHTML = q.ex;
  $("fb").className = "feedback on " + (ok ? "ok" : "ng");
  $("nextBtn").textContent = idx === qs.length - 1 ? "結果を見る" : "次へ";
  $("fb").scrollIntoView({behavior:"smooth", block:"nearest"});
}

function next(){
  idx++;
  if(idx >= qs.length){ finish(); return; }
  render();
  window.scrollTo(0, 0);
}

// 紙吹雪（n 枚を waves 回に分けて降らせる）
function confetti(n, waves){
  clearConfetti();
  const box = document.createElement("div");
  box.className = "confetti"; box.id = "confetti";
  const colors = ["#ff6b6b","#4d96ff","#ffb627","#22b07d","#b07cff","#ff8fc7"];
  for(let i = 0; i < n; i++){
    const p = document.createElement("i");
    p.style.left = Math.random() * 100 + "%";
    p.style.background = colors[i % colors.length];
    p.style.setProperty("--dx", (Math.random() * 160 - 80) + "px");
    p.style.setProperty("--r", (Math.random() * 1080 - 540) + "deg");
    p.style.animationDuration = (2.4 + Math.random() * 2) + "s";
    p.style.animationDelay = (Math.floor(Math.random() * waves) * 1.2 + Math.random() * .8) + "s";
    if(Math.random() < .3){ p.style.width = p.style.height = "10px"; p.style.borderRadius = "50%"; }
    box.appendChild(p);
  }
  document.body.appendChild(box);
  clearTimeout(confetti.t); confetti.t = setTimeout(clearConfetti, waves * 1200 + 5000);
}
function clearConfetti(){ const c = $("confetti"); if(c) c.remove(); }

// 得点を 0 から数え上げる
function countUp(el, to){
  let n = 0; el.textContent = 0;
  if(to === 0) return;
  const iv = setInterval(() => { n++; el.textContent = n; if(n >= to) clearInterval(iv); }, Math.min(90, 900 / to));
}

function finish(){
  const total = qs.length;
  const old = getBest(mode);
  const isNew = !old || score > old.score;
  if(isNew) setBest(mode, {score});
  // 演出の段階（10問なら 10／8〜9／5〜7／4以下。全問チャレンジも同じ割合で判定）
  const r = score / total;
  const tier = score === total ? "perfect" : r >= .8 ? "great" : r >= .5 ? "ok" : "low";
  $("rTotal").textContent = total;
  $("stage").className = "stage tier-" + tier;
  $("rMsg").textContent = {perfect:"パーフェクト！", great:"すばらしい！", ok:"もう少し！", low:"復習してもう一度！"}[tier];
  $("rBadge").textContent = mode === "all"
    ? {perfect:"👑 酸・塩基 完全制覇 👑", great:"あと少しで全問正解！", ok:"", low:""}[tier]
    : {perfect:"🏆 酸・塩基マスター 🏆", great:"あと少しで満点！", ok:"", low:""}[tier];
  // 10問で満点 → 全問チャレンジを解放（初めてのときは「解放！」、2回目以降は案内だけ）
  const firstUnlock = mode === "normal" && tier === "perfect" && !isUnlocked();
  if(mode === "normal" && tier === "perfect") unlock();
  $("rUnlock").hidden = !(mode === "normal" && tier === "perfect");
  $("rUnlockTtl").textContent = firstUnlock ? "🔓 全問チャレンジ 解放！" : "🔥 全問チャレンジに挑戦しよう";
  $("rUnlockTxt").innerHTML = "全 " + N_ALL + " 問を一気に出題する高難易度モード。<br>全問正解で「完全制覇」！";
  const nStars = {perfect:3, great:2, ok:1, low:0}[tier];
  // 星をアニメーションし直すため作り直す
  $("stars").innerHTML = [0,1,2].map(i => '<span class="' + (i < nStars ? "on" : "") + '">★</span>').join("");
  countUp($("rScore"), score);
  $("rNew").hidden = !isNew;
  if(tier === "perfect"){ confetti(160, 3); if(navigator.vibrate) navigator.vibrate([80,60,80,60,200]); }
  else if(tier === "great"){ confetti(70, 1); }
  $("rBest").textContent = (mode === "all" ? "全問チャレンジの" : "") + "自己ベスト：" + bestText(getBest(mode), total);
  $("review").innerHTML = wrongs.length === 0
    ? '<div class="perfect">全問正解！ よく覚えています 👏</div>'
    : "<h2>まちがえた問題</h2>" + wrongs.map(w =>
        '<div class="rv"><div class="q">' + w.q + '</div>' +
        '<div><span class="you">あなた：' + w.you + '</span>　<span class="ans">正解：' + w.ans + '</span></div>' +
        '<div class="ex">' + w.ex + '</div></div>').join("");
  show("result");
}

// タイトルの BEST は、一度でも最後まで遊んだ記録があるときだけ表示する
function showStartBest(){
  const b = getBest("normal"); $("bestBox").hidden = !b; if(b) $("bestStart").textContent = bestText(b, N_Q);
  // 全問チャレンジは解放済みのときだけ出す
  $("chalBox").hidden = !isUnlocked();
  $("chalBtn").textContent = "🔥 全問チャレンジ（" + N_ALL + "問）";
  const c = getBest("all"); $("chalBest").textContent = c ? "BEST　" + bestText(c, N_ALL) : "";
}
function toTitle(){ clearConfetti(); showStartBest(); show("start"); }

// ===== まとめ画面（物質データ S から作る） =====
function buildSummary(){
  const cls = {"強酸":"sa","弱酸":"wa","強塩基":"sb","弱塩基":"wb"};
  const sec = (t, label, c) => '<div class="sec"><span class="sec-ttl ' + c + '">' + label + '</span>' +
    S.filter(s => s.t === t).map(s =>
      '<div class="item"><div><div class="nm">' + s.n + '</div><div class="fm">' + F(s.f) + '</div></div>' +
      '<div class="badges"><span class="bd v">' + s.v + '価</span><span class="bd ' + cls[kind(s)] + '">' + kind(s) + '</span></div></div>'
    ).join("") + '</div>';
  $("sumBody").innerHTML = sec("酸", "酸", "acid") + sec("塩基", "塩基", "base");
}
$("sumBtn").addEventListener("click", () => { buildSummary(); show("summary"); });
$("sumBack").addEventListener("click", toTitle);
$("sumStart").addEventListener("click", () => startQuiz("normal"));

$("startBtn").addEventListener("click", () => startQuiz("normal"));
$("chalBtn").addEventListener("click", () => startQuiz("all"));
$("rUnlockBtn").addEventListener("click", () => startQuiz("all"));
$("retryBtn").addEventListener("click", () => startQuiz(mode));
$("topBtn").addEventListener("click", toTitle);
$("nextBtn").addEventListener("click", next);
$("quitBtn").addEventListener("click", () => $("modal").classList.add("on"));
$("noBtn").addEventListener("click", () => $("modal").classList.remove("on"));
$("yesBtn").addEventListener("click", () => { $("modal").classList.remove("on"); toTitle(); });
showStartBest();
</script>
